<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space | windforsea</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="subpage">

  <!-- 전체 화면 배경 이미지 (블러 효과 적용) -->
  <div class="background-container">
    <img 
      src="assets/home-hero.jpg" 
      alt="눈이 편안하고 따뜻한 아침 풍경" 
      class="background-image" 
    />
    <div class="background-overlay"></div>
  </div>

  <!-- 최상단 내비게이션 바 -->
  <header class="top-nav-bar">
    <!-- 좌측 상단 집모양 홈 버튼 -->
    <a href="index.html" class="home-btn" title="홈으로 이동" aria-label="홈으로 이동">
      <svg viewBox="0 0 24 24">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
    </a>

    <!-- 중앙 상단 3개 탭 (스페이스 활성화) -->
    <nav class="tab-container" role="navigation" aria-label="메인 메뉴">
      <a href="about.html" class="tab-link">자기소개</a>
      <a href="projects.html" class="tab-link">프로젝트</a>
      <a href="space.html" class="tab-link active">스페이스</a>
    </nav>

    <!-- 우측 대칭용 여백 -->
    <div style="width: 48px; height: 48px;"></div>
  </header>

  <!-- 메인 스페이스 글래스 카드 (비어있는 공간) -->
  <main class="page-container">
    <section class="glass-card">
      <div class="space-container">
        <div class="space-icon">🌱</div>
        <h2 class="space-title">비어있는 공간</h2>
        <p class="space-desc">
          새로운 아이디어와 기록을 위해 남겨둔 여백입니다.<br />
          블로그 글, 사진 모음, 또는 새로운 시도를 자유롭게 채워 넣으실 수 있습니다.
        </p>
      </div>
    </section>
  </main>

  <!-- 우측 하단 미니멀 워터마크 -->
  <div class="watermark">
    designed by @windforsea
  </div>

  <script src="script.js"></script>
</body>
</html>
