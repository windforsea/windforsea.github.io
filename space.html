<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space | windforsea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="subpage">

  <!-- 블루 사파이어 & 스카이 블루 리퀴드 글래스 앰비언트 배경 -->
  <div class="background-container" aria-hidden="true">
    <div class="sapphire-orb sapphire-orb-1"></div>
    <div class="sapphire-orb sapphire-orb-2"></div>
    <div class="sapphire-orb sapphire-orb-3"></div>
    <div class="background-overlay"></div>
  </div>

  <!-- 최상단 내비게이션 바 (홈버튼 삭제, 중앙 3개 탭 & 우측 책자 전환 링크) -->
  <header class="top-nav-bar">
    <!-- 중앙 상단 3개 탭 (스페이스 활성화) -->
    <nav class="tab-container" role="navigation" aria-label="메인 메뉴">
      <a href="index.html" class="tab-link">자기소개</a>
      <a href="projects.html" class="tab-link">프로젝트</a>
      <a href="space.html" class="tab-link active">스페이스</a>
    </nav>

    <!-- 우측 책자 전환 링크 -->
    <a href="book.html" class="version-switch-link" title="책자보기">
      <span>📖</span>
      <span class="btn-text">책자보기</span>
    </a>
  </header>

  <!-- 메인 스페이스 글래스 카드 (비어있는 공간 + 배경 사진 갤러리) -->
  <main class="page-container">
    <section class="glass-card">
      <div class="space-container">
        <div class="space-icon">🌱</div>
        <h2 class="space-title">비어있는 공간</h2>
        <p class="space-desc">
          새로운 아이디어와 기록을 위해 남겨둔 여백입니다.<br />
          블로그 글, 사진 모음, 또는 새로운 시도를 자유롭게 채워 넣으실 수 있습니다.
        </p>
      </div>

      <!-- 배경 사진 아카이브 갤러리 -->
      <div class="space-gallery-section">
        <div class="gallery-header">
          <h3 class="gallery-title">📷 Photo Archives</h3>
          <p class="gallery-subtitle">카드를 클릭하면 사진을 크게 감상할 수 있습니다</p>
        </div>

        <div class="space-gallery-grid">
          <!-- 사진 1: 대왕암 -->
          <div class="photo-card" data-src="assets/sledo.jpg" data-title="울산광역시 대왕암" data-desc="울산광역시 동구 일산동 • 기암괴석과 푸른 동해 바다">
            <div class="photo-thumb-wrapper">
              <img src="assets/sledo.jpg" alt="울산광역시 대왕암" class="photo-thumb" loading="lazy" />
            </div>
            <div class="photo-info">
              <h4 class="photo-title">울산 대왕암</h4>
              <span class="photo-meta">Daewangam Park</span>
            </div>
          </div>

          <!-- 사진 2: 선암호수공원 봄 -->
          <div class="photo-card" data-src="assets/sunam1.jpg" data-title="선암호수공원 (봄)" data-desc="울산광역시 남구 선암동 • 호수 산책로와 숲의 정취">
            <div class="photo-thumb-wrapper">
              <img src="assets/sunam1.jpg" alt="선암호수공원 (봄)" class="photo-thumb" loading="lazy" />
            </div>
            <div class="photo-info">
              <h4 class="photo-title">선암호수공원 (봄)</h4>
              <span class="photo-meta">Seonam Lake Park</span>
            </div>
          </div>

          <!-- 사진 3: 선암호수공원 산책로 -->
          <div class="photo-card" data-src="assets/sunam2.jpg" data-title="선암호수공원 (산책로)" data-desc="울산광역시 남구 선암동 • 잔잔한 호수 수변 데크길">
            <div class="photo-thumb-wrapper">
              <img src="assets/sunam2.jpg" alt="선암호수공원 (산책로)" class="photo-thumb" loading="lazy" />
            </div>
            <div class="photo-info">
              <h4 class="photo-title">선암호수공원 (산책로)</h4>
              <span class="photo-meta">Lake Promenade</span>
            </div>
          </div>

          <!-- 사진 4: 슬도 -->
          <div class="photo-card" data-src="assets/sledo2.jpg" data-title="울산광역시 슬도" data-desc="울산광역시 동구 방어동 • 슬도 등대와 시원한 파도 소리">
            <div class="photo-thumb-wrapper">
              <img src="assets/sledo2.jpg" alt="울산광역시 슬도" class="photo-thumb" loading="lazy" />
            </div>
            <div class="photo-info">
              <h4 class="photo-title">울산 슬도</h4>
              <span class="photo-meta">Seuldo Island</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 컴팩트 사진 모달 팝업 (너무 크게 확대되지 않는 적당한 크기) -->
  <div class="photo-modal" id="photoModal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="photo-modal-backdrop"></div>
    <div class="photo-modal-content">
      <button type="button" class="modal-close-btn" aria-label="닫기">✕</button>
      <div class="modal-img-container">
        <img src="" alt="" class="modal-img" id="modalImg" />
      </div>
      <div class="modal-caption">
        <h4 id="modalTitle"></h4>
        <p id="modalDesc"></p>
      </div>
    </div>
  </div>

  <!-- 우측 하단 미니멀 워터마크 -->
  <div class="watermark">
    <span class="watermark-credit">@windforsea</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
